<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Poemas de Mateo</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f4f1ea;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #d4c5b9;
            padding-bottom: 20px;
        }
        h1 {
            font-size: 2.5em;
            color: #2c2c2c;
            margin-bottom: 5px;
        }
        .subtitle {
            font-style: italic;
            color: #777;
        }
        .form-box, .poema-card {
            background: #ffffff;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1em;
        }
        textarea {
            height: 140px;
            resize: vertical;
        }
        button {
            background: #4a403a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background: #2c2c2c;
        }
        .poema-card h2 {
            margin-top: 0;
            color: #4a403a;
        }
        .fecha {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 20px;
            display: block;
        }
        .contenido-poema {
            white-space: pre-line;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <header>
        <h1>Los Poemas de Mateo</h1>
        <p class="subtitle">Un espacio autogestionado</p>
    </header>

    <main>
        <!-- Formulario para que Mateo escriba -->
        <div class="form-box">
            <h2>Escribir un nuevo poema</h2>
            <!-- Iframe oculto para procesar el envío sin recargar la página -->
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(enviando){ recargarDespuesDeEnviar(); }"></iframe>
            
            <form id="poemaForm" action="https://script.google.com/macros/s/AKfycbxYHO9d1HVYyKpOIG3jTXonQ207IktqD1dKbFBQpprR5yJeZxGjKEBo_c9xSc8VHteN/exec" method="GET" target="hidden_iframe">
                <input type="text" name="titulo" id="titulo" placeholder="Título del poema" required>
                <textarea name="contenido" id="contenido" placeholder="Escribe tu poema aquí..." required></textarea>
                <button type="submit" id="btnPublicar" onclick="activarEnvio()">Publicar Poema</button>
            </form>
        </div>

        <!-- Listado donde se cargarán los poemas -->
        <div id="listaPoemas">
            <p style="text-align: center; color: #777;">Cargando poemas...</p>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYHO9d1HVYyKpOIG3jTXonQ207IktqD1dKbFBQpprR5yJeZxGjKEBo_c9xSc8VHteN/exec";

        const listaPoemas = document.getElementById('listaPoemas');
        let enviando = false;

        async function cargarPoemas() {
            try {
                const response = await fetch(SCRIPT_URL);
                const poemas = await response.json();
                
                if (poemas.length === 0) {
                    listaPoemas.innerHTML = '<p style="text-align: center; color: #777;">Aún no hay poemas guardados. ¡Escribe el primero!</p>';
                    return;
                }

                listaPoemas.innerHTML = '';
                poemas.reverse().forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'poema-card';
                    card.innerHTML = `
                        <h2>${escapeHtml(p.titulo)}</h2>
                        <span class="fecha">${escapeHtml(p.fecha)}</span>
                        <div class="contenido-poema">${escapeHtml(p.contenido)}</div>
                    `;
                    listaPoemas.appendChild(card);
                });
            } catch (error) {
                listaPoemas.innerHTML = '<p style="text-align: center; color: #c0392b;">Error al conectar con la base de datos.</p>';
            }
        }

        function activarEnvio() {
            enviando = true;
            const btn = document.getElementById('btnPublicar');
            btn.textContent = 'Publicando...';
            btn.disabled = true;
        }

        function recargarDespuesDeEnviar() {
            if (!enviando) return;
            enviando = false;
            
            document.getElementById('poemaForm').reset();
            const btn = document.getElementById('btnPublicar');
            btn.textContent = 'Publicar Poema';
            btn.disabled = false;
            
            // Esperar un segundo a que Google guarde y recargar los poemas en pantalla
            setTimeout(cargarPoemas, 1500);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Cargar poemas al abrir la página
        cargarPoemas();
    </script>
</body>
</html>
