<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Poemas de Mateo</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f4f1ea;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #d4c5b9;
            padding-bottom: 20px;
        }
        h1 {
            font-size: 2.5em;
            color: #2c2c2c;
            margin-bottom: 5px;
        }
        .subtitle {
            font-style: italic;
            color: #777;
        }
        .form-box, .poema-card {
            background: #ffffff;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 1em;
        }
        textarea {
            height: 140px;
            resize: vertical;
        }
        button {
            background: #4a403a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background: #2c2c2c;
        }
        .poema-card h2 {
            margin-top: 0;
            color: #4a403a;
            padding-right: 70px;
        }
        .fecha {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 20px;
            display: block;
        }
        .contenido-poema {
            white-space: pre-line;
            font-size: 1.1em;
        }
        .btn-borrar {
            position: absolute;
            top: 25px;
            right: 25px;
            background: #c0392b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .btn-borrar:hover {
            background: #962d22;
        }
    </style>
</head>
<body>

    <header>
        <h1>Los Poemas de Mateo</h1>
        <p class="subtitle">Un espacio autogestionado</p>
    </header>

    <main>
        <div class="form-box">
            <h2>Escribir un nuevo poema</h2>
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
            
            <form id="poemaForm" action="https://script.google.com/macros/s/AKfycbxYHO9d1HVYyKpOIG3jTXonQ207IktqD1dKbFBQpprR5yJeZxGjKEBo_c9xSc8VHteN/exec" method="GET" target="hidden_iframe" onsubmit="notificarEnvio()">
                <input type="text" name="titulo" id="titulo" placeholder="Título del poema" required>
                <textarea name="contenido" id="contenido" placeholder="Escribe tu poema aquí..." required></textarea>
                <button type="submit" id="btnPublicar">Publicar Poema</button>
            </form>
        </div>

        <div id="listaPoemas">
            <p style="text-align: center; color: #777;">Cargando poemas...</p>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYHO9d1HVYyKpOIG3jTXonQ207IktqD1dKbFBQpprR5yJeZxGjKEBo_c9xSc8VHteN/exec";
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTnj3vbqv2xDFqKhiexLaFf2Hd-z_Cy7e8Er0UDtuLHKDX8xUQjqgGpvZj23dGPd3xyVZuSQQdNDy3r/pub?gid=0&single=true&output=csv";

        const listaPoemas = document.getElementById('listaPoemas');

        async function cargarPoemas() {
            try {
                const response = await fetch(CSV_URL + "&t=" + new Date().getTime());
                const dataText = await response.text();
                const filas = parseCSV(dataText);

                if (filas.length === 0 || (filas.length === 1 && !filas[0][1])) {
                    listaPoemas.innerHTML = '<p style="text-align: center; color: #777;">Aún no hay poemas guardados. ¡Escribe el primero!</p>';
                    return;
                }

                listaPoemas.innerHTML = '';
                [...filas].reverse().forEach((p, indexReal) => {
                    if (!p[1]) return;
                    const filaRealSheet = filas.length - indexReal + 1;
                    
                    const card = document.createElement('div');
                    card.className = 'poema-card';
                    card.innerHTML = `
                        <button class="btn-borrar" onclick="borrarPoema(${filaRealSheet})">Borrar</button>
                        <h2>${escapeHtml(p[1])}</h2>
                        <span class="fecha">${escapeHtml(p[0])}</span>
                        <div class="contenido-poema">${escapeHtml(p[2])}</div>
                    `;
                    listaPoemas.appendChild(card);
                });
            } catch (error) {
                listaPoemas.innerHTML = '<p style="text-align: center; color: #c0392b;">Error al conectar con la base de datos.</p>';
            }
        }

        function parseCSV(text) {
            let rows = [];
            let row = [''];
            let insideQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i+1];
                if (c === '"') {
                    if (insideQuotes && nextC === '"') { row[row.length - 1] += '"'; i++; }
                    else { insideQuotes = !insideQuotes; }
                } else if (c === ',' && !insideQuotes) {
                    row.push('');
                } else if ((c === '\r' && nextC === '\n' || c === '\n') && !insideQuotes) {
                    if (c === '\r') i++;
                    rows.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') rows.push(row);
            return rows.slice(1);
        }

        function borrarPoema(fila) {
            const pass = prompt("Ingresa la contraseña para borrar este poema:");
            if (!pass) return;

            const urlBorrar = `${SCRIPT_URL}?accion=borrar&fila=${fila}&pass=${encodeURIComponent(pass)}`;
            fetch(urlBorrar)
                .then(res => res.text())
                .then(res => {
                    if (res.trim() === "OK_BORRADO") {
                        alert("Poema borrado con éxito.");
                        setTimeout(cargarPoemas, 1000);
                    } else {
                        alert("Contraseña incorrecta.");
                    }
                });
        }

        function notificarEnvio() {
            const btn = document.getElementById('btnPublicar');
            btn.textContent = '¡Publicado con éxito!';
            btn.disabled = true;

            setTimeout(() => {
                document.getElementById('poemaForm').reset();
                btn.textContent = 'Publicar Poema';
                btn.disabled = false;
                cargarPoemas();
            }, 2000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        cargarPoemas();
    </script>
</body>
</html>
