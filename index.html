<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Poemas de Mateo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --fondo: #f5f6f8;
            --blanco: #ffffff;
            --texto: #20242a;
            --texto-suave: #737983;
            --borde: #e5e7eb;
            --principal: #4f46e5;
            --principal-hover: #4338ca;
            --rojo: #dc3545;
            --rojo-hover: #b91c2c;
            --sombra: 0 10px 30px rgba(15, 23, 42, 0.07);
            --sombra-hover: 0 18px 40px rgba(15, 23, 42, 0.11);
        }

        body {
            margin: 0 auto;
            padding: 35px 20px 60px;
            max-width: 980px;
            min-height: 100vh;
            background: radial-gradient(circle at top left, rgba(79, 70, 229, 0.07), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(124, 58, 237, 0.05), transparent 35%),
                        var(--fondo);
            color: var(--texto);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.6;
        }

        header {
            position: relative;
            text-align: center;
            padding: 30px 20px 35px;
            margin-bottom: 30px;
        }

        header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 4px;
            border-radius: 10px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
        }

        h1 {
            margin: 0;
            color: #18181b;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.2rem, 6vw, 3.6rem);
            font-weight: 600;
            letter-spacing: -1.5px;
        }

        .subtitle {
            margin: 10px 0 0;
            color: var(--texto-suave);
            font-size: 1rem;
            letter-spacing: 0.3px;
        }

        .form-box {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(229, 231, 235, 0.9);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: var(--sombra);
            backdrop-filter: blur(10px);
        }

        .form-box h2 {
            margin: 0 0 22px;
            font-size: 1.35rem;
            font-weight: 650;
            color: #27272a;
        }

        input, textarea {
            display: block;
            width: 100%;
            border: 1px solid var(--borde);
            background: #fafafa;
            color: var(--texto);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 15px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        input {
            height: 52px;
        }

        textarea {
            min-height: 170px;
            resize: vertical;
            line-height: 1.7;
        }

        input::placeholder, textarea::placeholder {
            color: #9ca3af;
        }

        input:focus, textarea:focus {
            background: #ffffff;
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);
        }

        #btnPublicar {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px 22px;
            background: linear-gradient(135deg, #4f46e5, #6d5dfc);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(79, 70, 229, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        #btnPublicar:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(79, 70, 229, 0.28);
        }

        #btnPublicar:disabled {
            cursor: default;
            opacity: 0.75;
            transform: none;
        }

        #listaPoemas {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .poema-card {
            position: relative;
            background: var(--blanco);
            border: 1px solid rgba(229, 231, 235, 0.9);
            border-radius: 20px;
            padding: 30px 32px;
            box-shadow: var(--sombra);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .poema-card h2 {
            margin: 0;
            padding-right: 90px;
            color: #24262b;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.5rem, 3vw, 2rem);
            line-height: 1.25;
            font-weight: 600;
        }

        .autor-etiqueta {
            display: inline-block;
            margin-top: 6px;
            color: var(--principal);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .fecha {
            display: block;
            margin-top: 4px;
            margin-bottom: 25px;
            color: #9ca3af;
            font-size: 0.82rem;
            letter-spacing: 0.4px;
        }

        .contenido-poema {
            display: block;
            width: 100%;
            color: #454951;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.08rem;
            line-height: 1.9;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .btn-borrar {
            position: absolute;
            top: 27px;
            right: 27px;
            border: 1px solid #f0c7cc;
            background: #fff7f8;
            color: var(--rojo);
            padding: 7px 12px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .btn-borrar:hover {
            background: var(--rojo);
            color: white;
            border-color: var(--rojo);
        }

        .mensaje {
            text-align: center;
            padding: 45px 20px;
            color: var(--texto-suave);
            background: rgba(255, 255, 255, 0.7);
            border: 1px dashed #d7dae0;
            border-radius: 18px;
        }

        .mensaje.error {
            color: var(--rojo);
            border-color: #f0b8bf;
        }

        @media (max-width: 600px) {
            body { padding: 18px 12px 40px; }
            h1 { font-size: 2.25rem; }
            .form-box { padding: 22px 18px; }
            .poema-card { padding: 24px 20px; }
            .poema-card h2 { padding-right: 70px; font-size: 1.45rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Los Poemas de Mateo</h1>
        <p class="subtitle">Un espacio autogestionado</p>
    </header>

    <main>
        <div class="form-box">
            <h2>Escribir un nuevo poema</h2>
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
            
            <form id="poemaForm" action="https://script.google.com/macros/s/AKfycbxYHO9d1HVYyKpOIG3jTXonQ207IktqD1dKbFBQpprR5yJeZxGjKEBo_c9xSc8VHteN/exec" method="GET" target="hidden_iframe" onsubmit="notificarEnvio()">
                <input type="text" name="autor" id="autor" placeholder="Autor (ej. Mateo)" required>
                <input type="text" name="titulo" id="titulo" placeholder="Título del poema" required>
                <textarea name="contenido" id="contenido" placeholder="Escribe tu poema aquí..." required></textarea>
                <button type="submit" id="btnPublicar">Publicar poema</button>
            </form>
        </div>

        <div id="listaPoemas">
            <div class="mensaje">Cargando poemas...</div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYHO9d1HVYyKpOIG3jTXonQ207IktqD1dKbFBQpprR5yJeZxGjKEBo_c9xSc8VHteN/exec";
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTnj3vbqv2xDFqKhiexLaFf2Hd-z_Cy7e8Er0UDtuLHKDX8xUQjqgGpvZj23dGPd3xyVZuSQQdNDy3r/pub?gid=0&single=true&output=csv";

        const listaPoemas = document.getElementById('listaPoemas');

        async function cargarPoemas() {
            try {
                const response = await fetch(CSV_URL + "&t=" + new Date().getTime());
                const dataText = await response.text();
                const filas = parseCSV(dataText);

                if (filas.length === 0 || (filas.length === 1 && !filas[0][2])) {
                    listaPoemas.innerHTML = `
                        <div class="mensaje">
                            Aún no hay poemas guardados.<br>
                            ¡Escribe el primero!
                        </div>
                    `;
                    return;
                }

                listaPoemas.innerHTML = '';
                [...filas].reverse().forEach((p, indexReal) => {
                    if (!p || !p[2]) return;
                    const filaRealSheet = filas.length - indexReal + 1;
                    
                    // Orden en el CSV de Google: p[0] = Fecha/Hora, p[1] = Autor, p[2] = Título, p[3] = Contenido
                    const fechaHora = p[0] || '';
                    const autor = p[1] || 'Mateo';
                    const titulo = p[2] || '';
                    const contenido = p[3] || '';

                    const card = document.createElement('div');
                    card.className = 'poema-card';
                    card.innerHTML = `
                        <button class="btn-borrar" onclick="borrarPoema(${filaRealSheet})">Borrar</button>
                        <h2>${escapeHtml(titulo)}</h2>
                        <span class="autor-etiqueta">Por: ${escapeHtml(autor)}</span>
                        <span class="fecha">Publicado el ${escapeHtml(fechaHora)}</span>
                        <div class="contenido-poema">${escapeHtml(contenido)}</div>
                    `;
                    listaPoemas.appendChild(card);
                });
            } catch (error) {
                listaPoemas.innerHTML = `
                    <div class="mensaje error">
                        Error al conectar con la base de datos.
                    </div>
                `;
            }
        }

        function parseCSV(text) {
            let rows = [];
            let row = [''];
            let insideQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i+1];
                if (c === '"') {
                    if (insideQuotes && nextC === '"') { row[row.length - 1] += '"'; i++; }
                    else { insideQuotes = !insideQuotes; }
                } else if (c === ',' && !insideQuotes) {
                    row.push('');
                } else if ((c === '\r' && nextC === '\n' || c === '\n') && !insideQuotes) {
                    if (c === '\r') i++;
                    rows.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') rows.push(row);
            return rows.slice(1);
        }

        function borrarPoema(fila) {
            const pass = prompt("Ingresa la contraseña para borrar este poema:");
            if (!pass) return;

            const urlBorrar = `${SCRIPT_URL}?accion=borrar&fila=${fila}&pass=${encodeURIComponent(pass)}`;
            fetch(urlBorrar)
                .then(res => res.text())
                .then(res => {
                    if (res.trim() === "OK_BORRADO") {
                        alert("Poema borrado con éxito.");
                        setTimeout(cargarPoemas, 1000);
                    } else {
                        alert("Contraseña incorrecta.");
                    }
                })
                .catch(() => alert("No se pudo conectar con el servidor."));
        }

        function notificarEnvio() {
            const btn = document.getElementById('btnPublicar');
            btn.textContent = '¡Publicado con éxito!';
            btn.disabled = true;

            setTimeout(() => {
                document.getElementById('poemaForm').reset();
                btn.textContent = 'Publicar poema';
                btn.disabled = false;
                cargarPoemas();
            }, 2000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        cargarPoemas();
    </script>
</body>
</html>
